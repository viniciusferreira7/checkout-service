# Supply-chain hardening.
# Dependency build scripts are blocked by default; anything not listed under
# `allowBuilds` fails the install (strictDepBuilds) instead of silently warning.

# Refuse versions published less than 7 days ago (in minutes).
minimumReleaseAge: 10080

# Pin exact versions instead of writing ranges.
saveExact: true

# Fail when the local Node/pnpm does not satisfy the `engines` field.
engineStrict: true

# CI-safe default: install from the lockfile as-is.
preferFrozenLockfile: true

verifyDepsBeforeRun: false

# Any dependency with an unreviewed lifecycle script fails the install.
strictDepBuilds: true

allowBuilds:
  # Telemetry/funding postinstalls — nothing needed at runtime.
  '@nestjs/core': false
  '@scarf/scarf': false
  # Native transformer used by Vitest for NestJS decorator metadata.
  '@swc/core': true
