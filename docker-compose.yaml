services:
  checkout-service-postgresql:
    container_name: checkout-service-postgresql
    image: postgres:17.2
    ports:
      - ${DATABASE_PORT:-5439}:5432
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 2s
      retries: 20
    networks:
      - checkout-service-network
    volumes:
      - checkout_service_pg_data:/var/lib/postgresql/data

  checkout-service-postgresql-test:
    container_name: checkout-service-postgresql-test
    image: postgres:17.2
    profiles:
      - test
    ports:
      - ${DATABASE_TEST_PORT:-5440}:5432
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: checkout_db_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d checkout_db_test"]
      interval: 5s
      timeout: 2s
      retries: 20
    networks:
      - checkout-service-network
    tmpfs:
      - /var/lib/postgresql/data

networks:
  checkout-service-network:
    driver: bridge

volumes:
  checkout_service_pg_data:
